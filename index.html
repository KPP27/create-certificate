<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Генератор сертифікатів</title>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.0.0/dist/fontkit.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 32px 28px;
            max-width: 500px;
            width: 100%;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(120deg, #1e293b, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .sub {
            color: #475569;
            margin-bottom: 28px;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            font-size: 0.95rem;
        }

        .course-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .course-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .course-selector label:hover {
            background: rgba(59,130,246,0.05);
        }

        .course-selector input[type="radio"] {
            accent-color: #3b82f6;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .course-selector input[type="radio"]:checked + span {
            font-weight: 600;
            color: #2563eb;
        }

        .course-selector label:has(input:checked) {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.08);
        }

        label {
            font-weight: 600;
            display: block;
            margin: 20px 0 8px 0;
            color: #0f172a;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        input, button {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 24px;
            transition: all 0.2s ease;
        }

        input {
            border: 1px solid #cbd5e1;
            background: white;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        input[type="date"] {
            color-scheme: light;
            cursor: pointer;
        }

        button {
            background: linear-gradient(95deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 28px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        button:hover {
            background: linear-gradient(95deg, #2563eb, #1d4ed8);
            transform: scale(1.01);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .info {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #1e293b;
            margin-top: 20px;
            text-align: center;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.7rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>🎓 Генератор сертифікатів</h2>
    <div class="sub">Оберіть курс та заповніть дані</div>

    <!-- Вибір курсу -->
    <div class="course-selector">
        <label>
            <input type="radio" name="course" value="installer" checked>
            <span>🛠️ Монтажник СЕС</span>
        </label>
        <label>
            <input type="radio" name="course" value="designer">
            <span>📐 Проєктувальник СЕС</span>
        </label>
    </div>

    <label>📛 ПІБ студента / студентки</label>
    <input type="text" id="name" placeholder="Іваненко Іван" autocomplete="off">

    <label>📅 Дата видачі</label>
    <input type="date" id="date">

    <button id="gen">✨ Завантажити PDF-сертифікат</button>

    <div id="info" class="info">✅ Шаблони і шрифт готові</div>
    <div id="error" class="error"></div>
    <footer>
        PDF створюється у вашому браузері.<br>
        Дані не передаються на сервер.
    </footer>
</div>

<script>
    (async function() {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;

        // ---------- НАЛАШТУВАННЯ ДЛЯ КОЖНОГО КУРСУ ----------
        const COURSES = {
            installer: {
                label: 'Монтажник СЕС',
                image: 'template_designer.jpg',
                nameX: 0.155,
                nameY: 0.519,
                dateX: 0.2925,
                dateY: 0.142,
                nameSize: 46,
                dateSize: 29,
                nameColor: { r: 37/255, g: 37/255, b: 39/255 },
                dateColor: { r: 51/255, g: 52/255, b: 56/255 }
            },
            designer: {
                label: 'Проєктувальник СЕС',
                image: 'template_designer.jpg',
                nameX: 0.155,
                nameY: 0.519,
                dateX: 0.2925,
                dateY: 0.142,
                nameSize: 46,
                dateSize: 29,
                nameColor: { r: 37/255, g: 37/255, b: 39/255 },
                dateColor: { r: 51/255, g: 52/255, b: 56/255 }
            }
        };

        const FONT_URL = 'gilroy-regular-italic.ttf';

        // Завантаження шрифту (один раз)
        let fontBytes = null;
        try {
            const fontResp = await fetch(FONT_URL);
            if (!fontResp.ok) throw new Error(`Шрифт не завантажено: ${FONT_URL}`);
            fontBytes = await fontResp.arrayBuffer();
            document.getElementById('info').innerHTML = '✅ Шрифт завантажено.';
        } catch (err) {
            document.getElementById('error').innerText = err.message;
            console.error(err);
            return;
        }

        // Установка сегодняшней даты
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;

        // ---------- Допоміжні функції ----------
        function transliterateUkrainian(name) {
            const map = {
                'а': 'a', 'б': 'b', 'в': 'v', 'г': 'h', 'ґ': 'g',
                'д': 'd', 'е': 'e', 'є': 'ye', 'ж': 'zh', 'з': 'z',
                'и': 'y', 'і': 'i', 'ї': 'yi', 'й': 'y', 'к': 'k',
                'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o', 'п': 'p',
                'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f',
                'х': 'kh', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'shch',
                'ь': '', 'ю': 'yu', 'я': 'ya',
                ' ': '_'
            };
            let lower = name.toLowerCase();
            let result = '';
            for (let c of lower) {
                result += map[c] || (/[a-z0-9]/i.test(c) ? c : '');
            }
            return result;
        }

        function formatDateForCertificate(dateStr) {
            if (!dateStr) return new Date().toLocaleDateString('uk-UA');
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return dateStr;
        }

        function capitalizeWords(str) {
            return str.split(' ').map(word => {
                if (word.length === 0) return word;
                return word[0].toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');
        }

        // ---------- Генерація PDF ----------
        document.getElementById('gen').onclick = async () => {
            const rawName = document.getElementById('name').value.trim();
            const rawDate = document.getElementById('date').value;
            const courseEl = document.querySelector('input[name="course"]:checked');
            if (!courseEl) {
                document.getElementById('error').innerText = 'Оберіть курс';
                return;
            }
            const courseKey = courseEl.value;
            const course = COURSES[courseKey];
            if (!course) {
                document.getElementById('error').innerText = 'Невідомий курс';
                return;
            }

            if (!rawName) {
                document.getElementById('error').innerText = 'Будь ласка, введіть ПІБ студента';
                return;
            }
            document.getElementById('error').innerText = '';
            document.getElementById('info').innerHTML = '⏳ Генерація PDF...';

            try {
                const formattedName = capitalizeWords(rawName);

                // Завантажуємо зображення для вибраного курсу
                const imgResp = await fetch(course.image);
                if (!imgResp.ok) throw new Error(`Не вдалося завантажити шаблон: ${course.image}`);
                const imageBytes = await imgResp.arrayBuffer();

                const pdfDoc = await PDFDocument.create();
                pdfDoc.registerFontkit(fontkit);

                let image;
                try {
                    image = await pdfDoc.embedPng(imageBytes);
                } catch (e) {
                    image = await pdfDoc.embedJpg(imageBytes);
                }

                let customFont;
                try {
                    customFont = await pdfDoc.embedFont(fontBytes);
                } catch (e) {
                    console.warn('Не вдалося завантажити шрифт, використовуємо Helvetica', e);
                    customFont = await pdfDoc.embedFont(StandardFonts.Helvetica);
                }

                const page = pdfDoc.addPage([image.width, image.height]);
                page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });

                // Координати з налаштувань курсу
                const nameX = image.width * course.nameX;
                const nameY = image.height * course.nameY;
                const dateX = image.width * course.dateX;
                const dateY = image.height * course.dateY;

                // Ім'я
                const nameWidth = customFont.widthOfTextAtSize(formattedName, course.nameSize);
                page.drawText(formattedName, {
                    x: nameX - nameWidth / 2,
                    y: nameY,
                    size: course.nameSize,
                    font: customFont,
                    color: rgb(course.nameColor.r, course.nameColor.g, course.nameColor.b),
                });

                // Дата
                const displayDate = rawDate ? formatDateForCertificate(rawDate) : formatDateForCertificate(document.getElementById('date').value);
                const dateWidth = customFont.widthOfTextAtSize(displayDate, course.dateSize);
                page.drawText(displayDate, {
                    x: dateX - dateWidth / 2,
                    y: dateY,
                    size: course.dateSize,
                    font: customFont,
                    color: rgb(course.dateColor.r, course.dateColor.g, course.dateColor.b),
                });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);

                const latinName = transliterateUkrainian(formattedName).replace(/[^a-z0-9_]/gi, '_');
                const capitalizedLatin = latinName.split('_').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('_');
                const fileName = `${capitalizedLatin}_Certificate.pdf`;
                link.download = fileName;

                link.click();
                URL.revokeObjectURL(link.href);
                document.getElementById('info').innerHTML = `✅ Сертифікат "${fileName}" збережено.`;
            } catch (err) {
                document.getElementById('error').innerText = 'Помилка: ' + err.message;
                console.error(err);
            }
        };
    })();
</script>
</body>
</html>
