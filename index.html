<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Сертификат</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>body{font-family:sans-serif;padding:2rem;}</style>
</head>
<body>
<h2>Генератор сертификатов</h2>
<label>ФИО: <input type="text" id="name"></label><br>
<label>Дата: <input type="text" id="date"></label><br>
<button id="gen">Скачать PDF</button>
<script>
(async function() {
  const { PDFDocument, rgb, StandardFonts } = PDFLib;
  // Загружаем изображение из файла (положите template.jpg рядом с index.html)
  const imgResp = await fetch('template.jpg');
  const imgBlob = await imgResp.blob();
  const imgBytes = await imgBlob.arrayBuffer();

  document.getElementById('gen').onclick = async () => {
    const name = document.getElementById('name').value.trim() || 'Имя Фамилия';
    const date = document.getElementById('date').value.trim() || new Date().toLocaleDateString('ru-RU');
    const pdfDoc = await PDFDocument.create();
    let image;
    try {
      image = await pdfDoc.embedPng(imgBytes);
    } catch(e) {
      image = await pdfDoc.embedJpg(imgBytes);
    }
    const page = pdfDoc.addPage([image.width, image.height]);
    page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const nameX = image.width * 0.5;
    const nameY = image.height * 0.45;
    const dateX = image.width * 0.5;
    const dateY = image.height * 0.6;
    const nameWidth = font.widthOfTextAtSize(name, 42);
    const dateWidth = font.widthOfTextAtSize(date, 28);
    page.drawText(name, { x: nameX - nameWidth/2, y: nameY, size: 42, font, color: rgb(0,0,0) });
    page.drawText(date, { x: dateX - dateWidth/2, y: dateY, size: 28, font, color: rgb(0,0,0) });
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], {type:'application/pdf'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${name}_certificate.pdf`;
    link.click();
    URL.revokeObjectURL(link.href);
  };
})();
</script>
</body>
</html>
