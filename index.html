<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Сертификат – Gilroy Italic</title>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.0.0/dist/fontkit.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; font-size: 1rem; }
        button { background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .error { color: red; margin-top: 10px; }
        .info { color: #2563eb; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h2>Генератор сертификатов (шрифт Gilroy Italic)</h2>
    <label>ФИО студента:</label>
    <input type="text" id="name" placeholder="Иванов Иван">

    <label>Дата выдачи:</label>
    <input type="date" id="date" style="display: block; width: 100%;">

    <button id="gen">Скачать PDF</button>
    <div id="error" class="error"></div>
    <div id="info" class="info"></div>

    <script>
        (async function() {
            const { PDFDocument, rgb } = PDFLib;

            // ---------- НАСТРОЙКИ (меняйте здесь) ----------
            const IMAGE_URL = 'template.jpg';                // ваш фоновый рисунок
            const FONT_URL = 'gilroy-regular-italic.ttf';    // файл шрифта

            // Позиционирование текста (коэффициенты от 0 до 1)
            const NAME_X_FACTOR = 0.155;       // смещение имени по X
            const NAME_Y_FACTOR = 0.519;      // смещение имени по Y
            const DATE_X_FACTOR = 0.3;       // смещение даты по X
            const DATE_Y_FACTOR = 0.125;       // смещение даты по Y

            // Размер шрифта
            const NAME_FONT_SIZE = 45;
            const DATE_FONT_SIZE = 28;

            // Цвет текста (RGB от 0 до 1)
            const TEXT_COLOR = { r: 37/255, g: 37/255, b: 39/255 };
            // ----------------------------------------------

            // Устанавливаем сегодняшнюю дату в поле date (формат YYYY-MM-DD)
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayFormatted = `${yyyy}-${mm}-${dd}`;
            document.getElementById('date').value = todayFormatted;

            let imageBytes, fontBytes;

            try {
                const imgResp = await fetch(IMAGE_URL);
                if (!imgResp.ok) throw new Error(`Не удалось загрузить изображение: ${IMAGE_URL}`);
                imageBytes = await imgResp.arrayBuffer();

                const fontResp = await fetch(FONT_URL);
                if (!fontResp.ok) throw new Error(`Не удалось загрузить шрифт: ${FONT_URL}`);
                fontBytes = await fontResp.arrayBuffer();
                document.getElementById('info').innerText = '✓ Шаблон и шрифт загружены.';
            } catch (err) {
                document.getElementById('error').innerText = err.message;
                console.error(err);
                return;
            }

            // Функция транслитерации (русские буквы -> латиница)
            function transliterate(name) {
                const map = {
                    'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'yo',
                    'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm',
                    'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
                    'ф': 'f', 'х': 'kh', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'shch',
                    'ъ': '', 'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya',
                    ' ': '_'
                };
                return name.toLowerCase().split('').map(c => map[c] || (/[a-z0-9]/i.test(c) ? c : '')).join('');
            }

            // Преобразование даты из формата YYYY-MM-DD в формат DD.MM.YYYY для отображения на сертификате
            function formatDateForCertificate(dateStr) {
                if (!dateStr) return new Date().toLocaleDateString('ru-RU');
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    return `${parts[2]}.${parts[1]}.${parts[0]}`;
                }
                return dateStr;
            }

            document.getElementById('gen').onclick = async () => {
                const studentName = document.getElementById('name').value.trim();
                let rawDate = document.getElementById('date').value;
                if (!studentName) {
                    document.getElementById('error').innerText = 'Введите имя студента';
                    return;
                }
                document.getElementById('error').innerText = '';
                document.getElementById('info').innerText = 'Генерация PDF...';

                try {
                    const pdfDoc = await PDFDocument.create();
                    pdfDoc.registerFontkit(fontkit);

                    let image;
                    try {
                        image = await pdfDoc.embedPng(imageBytes);
                    } catch (e) {
                        image = await pdfDoc.embedJpg(imageBytes);
                    }

                    const customFont = await pdfDoc.embedFont(fontBytes);
                    const page = pdfDoc.addPage([image.width, image.height]);
                    page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });

                    // Позиции
                    const nameX = image.width * NAME_X_FACTOR;
                    const nameY = image.height * NAME_Y_FACTOR;
                    const dateX = image.width * DATE_X_FACTOR;
                    const dateY = image.height * DATE_Y_FACTOR;

                    // Имя
                    const nameWidth = customFont.widthOfTextAtSize(studentName, NAME_FONT_SIZE);
                    page.drawText(studentName, {
                        x: nameX - nameWidth / 2,
                        y: nameY,
                        size: NAME_FONT_SIZE,
                        font: customFont,
                        color: rgb(TEXT_COLOR.r, TEXT_COLOR.g, TEXT_COLOR.b),
                    });

                    // Дата
                    let displayDate = rawDate ? formatDateForCertificate(rawDate) : formatDateForCertificate(todayFormatted);
                    const dateWidth = customFont.widthOfTextAtSize(displayDate, DATE_FONT_SIZE);
                    page.drawText(displayDate, {
                        x: dateX - dateWidth / 2,
                        y: dateY,
                        size: DATE_FONT_SIZE,
                        font: customFont,
                        color: rgb(TEXT_COLOR.r, TEXT_COLOR.g, TEXT_COLOR.b),
                    });

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    
                    const latinName = transliterate(studentName).replace(/[^a-z0-9_]/gi, '_');
                    const fileName = `${latinName}_Сертификат.pdf`;
                    link.download = fileName;
                    
                    link.click();
                    URL.revokeObjectURL(link.href);
                    document.getElementById('info').innerText = `✓ Сертификат "${fileName}" готов.`;
                } catch (err) {
                    document.getElementById('error').innerText = 'Ошибка при создании PDF: ' + err.message;
                    console.error(err);
                }
            };
        })();
    </script>
</body>
</html>
