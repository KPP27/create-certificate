<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор сертификатов</title>
    <!-- Подключаем библиотеку pdf-lib с CDN -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 550px;
            width: 100%;
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            color: #1e293b;
        }
        .sub {
            color: #475569;
            margin-bottom: 28px;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
        }
        label {
            font-weight: 600;
            display: block;
            margin: 18px 0 6px 0;
            color: #0f172a;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            transition: 0.2s;
            background: #fff;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            margin-top: 28px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .file-info {
            background: #f8fafc;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #334155;
            margin-top: 20px;
            text-align: center;
            word-break: break-word;
        }
        .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        hr {
            margin: 20px 0 10px;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎓 Генератор сертификатов</h1>
    <div class="sub">Заполните поля — скачайте готовый PDF</div>

    <label>Фамилия и имя студента</label>
    <input type="text" id="studentName" placeholder="Иванов Иван" autocomplete="off">

    <label>Дата выдачи</label>
    <input type="text" id="issueDate" placeholder="25.04.2026" autocomplete="off">

    <button id="generateBtn">✨ Скачать PDF-сертификат</button>

    <div class="file-info" id="templateStatus">
        ✅ Шаблон загружен (JPEG, Base64)
    </div>
    <div id="errorMsg" class="error"></div>
    <hr>
    <footer>
        PDF генерируется прямо в браузере с помощью pdf-lib.<br>
        Ваши данные не покидают компьютер.
    </footer>
</div>

5k/+v+7/AO/f/af/AJ9f+ZP/AK/7v/v3/wBp/wDn1/5k/wDr/u/+/f8A2n/59f8AmT/6/wC7/wC/f/af/n1/5k/+v+7/AO/f/af/AJ9f+ZP/AK/7v/v3/wBp/wDn1/5k/wDr/u/+/f8A2n/59f8AmT/6/wC7/wC/f/af/n1/5k/+v+7/AO/f/af/AJ9f+ZP/AK/7v/v3/wBp/wDn1/5k/wDr/u/+/f8A2n/59f8AmT/6/wC7/wC/f/af/n1/5k/+v+7/AO/f/bz/AJ+f+Wn/AMxH/wCv/t5/z8/8tP8A5iP/ANf/AG8/5+f+Wn/zEf8A6/8At5/z8/8ALT/5iP8A9f8A28/5+f8Alp/8xH/6/wDt5/z8/wDLT/5iP/1/9vP+fn/lp/8AMR/+v/t5/wA/P/LT/wCYj/8AX/28/wCfn/lp/wDMR/8Ar/7ef8/P/LT/AOYj/wDX/wBvP+fn/lp/8xH/AOv/ALef8/P/AC0/+Yj/APX/ANvP+fn/AJaf/MR/+v8A7ef8/P8Ay0/+Yj/9f/bz/n5/5af/ADEf/r/7ef8APz/y0/8AmI//AF/8vP8A8/P/AC0/+Yj/APX/AMvP/wA/P/LT/wCYj/8AX/y8/wDz8/8AL/8A+//9+fn/AM/P/L//AO//APf1AP/3/8Az//Z";

        let templateImageBytes = null;

        function base64ToUint8Array(base64) {
            const raw = atob(base64.split(',')[1]);
            const arr = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) {
                arr[i] = raw.charCodeAt(i);
            }
            return arr;
        }

        async function loadTemplate() {
            try {
                const bytes = base64ToUint8Array(YOUR_BASE64_JPEG);
                templateImageBytes = bytes;
                document.getElementById('templateStatus').innerHTML = '✅ Шаблон сертификата загружен (JPEG). Нажмите кнопку для генерации PDF.';
                return true;
            } catch (e) {
                console.error(e);
                document.getElementById('templateStatus').innerHTML = '⚠️ Ошибка загрузки шаблона. Проверьте код картинки.';
                return false;
            }
        }

        // --------------------------------------------------------------
        // НАСТРОЙКИ РАСПОЛОЖЕНИЯ ТЕКСТА (измените под свой макет)
        // --------------------------------------------------------------
        // namePosFactor — доля ширины и высоты для имени (x, y)
        // datePosFactor — доля ширины и высоты для даты
        // fontSizeName, fontSizeDate — размер шрифта (в пунктах, но pdf-lib использует единицы, равные размеру страницы)
        // Мы будем использовать относительные координаты, чтобы адаптироваться к любому размеру изображения.
        // По умолчанию: имя по центру (0.5), на 45% высоты; дата по центру, на 60% высоты.
        const NAME_POS_X_FACTOR = 0.5;      // 0 = лево, 1 = право
        const NAME_POS_Y_FACTOR = 0.45;     // 0 = верх, 1 = низ
        const DATE_POS_X_FACTOR = 0.5;
        const DATE_POS_Y_FACTOR = 0.6;
        const FONT_SIZE_NAME = 42;
        const FONT_SIZE_DATE = 28;
        // Цвет текста (RGB, значения от 0 до 1)
        const TEXT_COLOR = { r: 0, g: 0, b: 0 }; // чёрный

        async function generatePDF(studentName, issueDate) {
            if (!studentName.trim()) {
                throw new Error('Введите фамилию и имя студента');
            }
            if (!issueDate.trim()) {
                issueDate = new Date().toLocaleDateString('ru-RU');
            }
            if (!templateImageBytes) {
                throw new Error('Шаблон не загружен. Перезагрузите страницу.');
            }

            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            const pdfDoc = await PDFDocument.create();

            const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

            let imageEmbed;
            try {
                imageEmbed = await pdfDoc.embedPng(templateImageBytes);
            } catch (e) {
                imageEmbed = await pdfDoc.embedJpg(templateImageBytes);
            }

            const imgWidth = imageEmbed.width;
            const imgHeight = imageEmbed.height;

            const page = pdfDoc.addPage([imgWidth, imgHeight]);

            page.drawImage(imageEmbed, {
                x: 0,
                y: 0,
                width: imgWidth,
                height: imgHeight,
            });

            const nameX = imgWidth * NAME_POS_X_FACTOR;
            const nameY = imgHeight * NAME_POS_Y_FACTOR;
            const dateX = imgWidth * DATE_POS_X_FACTOR;
            const dateY = imgHeight * DATE_POS_Y_FACTOR;

            // Вычисляем ширину текста для центрирования
            const nameWidth = font.widthOfTextAtSize(studentName, FONT_SIZE_NAME);
            const dateWidth = font.widthOfTextAtSize(issueDate, FONT_SIZE_DATE);

            page.drawText(studentName, {
                x: nameX - nameWidth / 2,
                y: nameY,
                size: FONT_SIZE_NAME,
                font: font,
                color: rgb(TEXT_COLOR.r, TEXT_COLOR.g, TEXT_COLOR.b),
            });

            page.drawText(issueDate, {
                x: dateX - dateWidth / 2,
                y: dateY,
                size: FONT_SIZE_DATE,
                font: font,
                color: rgb(TEXT_COLOR.r, TEXT_COLOR.g, TEXT_COLOR.b),
            });

            const pdfBytes = await pdfDoc.save();

            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `${studentName.replace(/[^a-zа-яё\s]/gi, '')}_certificate.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        await loadTemplate();

        const generateBtn = document.getElementById('generateBtn');
        const nameInput = document.getElementById('studentName');
        const dateInput = document.getElementById('issueDate');
        const errorDiv = document.getElementById('errorMsg');

        generateBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const date = dateInput.value.trim();
            errorDiv.textContent = '';
            try {
                await generatePDF(name, date);
            } catch (err) {
                errorDiv.textContent = err.message;
                console.error(err);
            }
        });
    })();
